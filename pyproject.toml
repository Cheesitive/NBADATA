[project]
name = "nbadata"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pandas==3.0.6",
    "numpy==2.5.3",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "tzdata==2026.4",
]

[project.scripts]
rq = "run_query:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["run_query"]
